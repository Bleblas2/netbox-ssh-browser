[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netbox-ssh-browser"
dynamic = ["version"]
description = "Interactive NetBox SSH device browser"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Lukasz Luczak", email = "bleblas@gmail.com" },
]

keywords = ["netbox", "ssh", "tui", "network-automation", "iterm2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
]
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4,<5",
  "textual>=1,<8",
]

[project.urls]
Homepage = "https://github.com/bleblas2/netbox-ssh-browser"
Repository = "https://github.com/bleblas2/netbox-ssh-browser.git"
Issues = "https://github.com/bleblas2/netbox-ssh-browser/issues"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "twine>=7,<8",
]

[project.scripts]
nssh = "netbox_ssh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_ssh"]

[tool.hatch.version]
path = "src/netbox_ssh/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
